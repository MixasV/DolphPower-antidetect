<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DolfPower - IP Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 30px; }
        .status { padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .status.loading { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.5); }
        .status.success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); }
        .status.warning { background: rgba(245, 158, 60, 0.2); border: 1px solid rgba(245, 158, 60, 0.5); }
        .status.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #60a5fa; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ip-display { font-size: 36px; font-weight: bold; color: #60a5fa; margin: 15px 0; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 20px; }
        .info-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; }
        .info-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 14px; color: white; }
        .error-message { font-size: 18px; color: #f87171; }
        .error-details { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 10px; }
        .flag { font-size: 48px; margin-bottom: 10px; }
        .close-btn {
            margin-top: 25px; padding: 12px 30px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 8px; color: white;
            font-size: 16px; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .close-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐬</div>
        <h1>DolfPower</h1>
        <p class="subtitle">IP & Location Check</p>
        <div id="status" class="status loading">
            <div class="spinner"></div>
            <p>Checking your IP address...</p>
        </div>
        <div id="result" style="display: none;"></div>
        <button class="close-btn" onclick="window.location.href='https://www.google.com'">Continue Browsing</button>
    </div>
    <script>
        const API_URL = 'http://127.0.0.1:3001';
        
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 10000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id); return response;
            } catch (e) { clearTimeout(id); throw e; }
        }

        async function checkIP() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('profileId');

            try {
                const services = [
                    { url: 'http://ip-api.com/json/', parse: parseIpApi },
                    { url: 'https://ipapi.co/json/', parse: parseIpApiCo },
                    { url: 'https://ip.nf/me.json', parse: (data) => ({ ip: data.ip.ip, country: data.ip.country, countryCode: data.ip.country_code, city: data.ip.city }) },
                    { url: 'https://api.ipify.org?format=json', parse: parseIpify }
                ];
                
                let detectedIp = null;
                for (const service of services) {
                    try {
                        const response = await fetchWithTimeout(service.url);
                        if (response.ok) {
                            const data = await response.json();
                            detectedIp = service.parse(data);
                            if (detectedIp && detectedIp.ip) break;
                        }
                    } catch (e) {}
                }
                
                if (detectedIp && detectedIp.ip) {
                    // Get proxy info to check if we need to verify proxy
                    let hasProxy = false;
                    if (profileId) {
                        try {
                            const profileRes = await fetch(`${API_URL}/v1.0/browser_profiles/${profileId}`);
                            const profileData = await profileRes.json();
                            hasProxy = profileData.success && profileData.data?.profile?.proxy_id;
                        } catch (e) {}
                    }
                    
                    showSuccess(detectedIp.ip, hasProxy ? '(via proxy)' : '');
                    
                    // Update backend
                    if (profileId) {
                        try {
                            await fetch(`${API_URL}/v1.0/browser_profiles/${profileId}/ip-update`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    ip: detectedIp.ip,
                                    country: detectedIp.countryCode || detectedIp.country,
                                    city: detectedIp.city
                                })
                            });
                            await fetch(`${API_URL}/v1.0/browser_profiles/${profileId}/unlock`, { method: 'POST' });
                            // For profiles without proxy - navigate to start_url after unlock
                            if (!hasProxy) {
                                const profileRes2 = await fetch(`${API_URL}/v1.0/browser_profiles/${profileId}`);
                                const profileData2 = await profileRes2.json();
                                const startUrls = profileData2.data?.profile?.start_urls?.split('\n')?.filter(u => u.trim());
                                if (startUrls && startUrls.length > 0) {
                                    setTimeout(() => {
                                        window.location.href = startUrls[0];
                                    }, 1000);
                                }
                            }
                        } catch (e) {
                            console.error('Failed to update IP or unlock:', e);
                        }
                    }
                } else {
                    showError('Could not determine IP address', 'All IP check services failed.');
                }
            } catch (error) {
                showError('Connection Error', error.message || 'Failed to check IP.');
            }
        }

        function parseIpApi(data) {
            if (data.status === 'fail') return null;
            return { ip: data.query, country: data.country, countryCode: data.countryCode, city: data.city, region: data.regionName, isp: data.isp };
        }
        function parseIpApiCo(data) {
            if (data.error) return null;
            return { ip: data.ip, country: data.country_name, countryCode: data.country_code, city: data.city, region: data.region };
        }
        function parseIpify(data) { return { ip: data.ip }; }
        function getCountryFlag(countryCode) {
            if (!countryCode || countryCode.length !== 2) return '🌍';
            return String.fromCodePoint(...countryCode.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0)));
        }
        function showSuccess(ip, modeLabel = '') {
            document.getElementById('status').className = 'status success';
            document.getElementById('status').innerHTML = `<div class="flag">✓</div><p style="color: #34d399; font-size: 14px;">Connection Verified${modeLabel ? ' ' + modeLabel : ''}</p><div class="ip-display">${ip}</div>`;
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `<div class="info-grid"><div class="info-item"><div class="info-label">Status</div><div class="info-value">Active</div></div><div class="info-item"><div class="info-label">Proxy Mode</div><div class="info-value">${modeLabel || 'Direct'}</div></div></div>`;
        }
        function showError(title, details) {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').innerHTML = `<div style="font-size: 48px; margin-bottom: 15px;">⚠️</div><div class="error-message">${title}</div><div class="error-details">${details}</div>`;
        }
        checkIP();
    </script>
</body>
</html>
